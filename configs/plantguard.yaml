project:
  name: plantguard
  seed: 42
  device: auto

paths:
  plantvillage: data/raw/plantvillage
  leaf_filter: data/processed/leaf_filter
  plantseg: data/raw/plantseg
  artifacts: artifacts
  sam2_checkpoint: artifacts/sam2/sam2.1_hiera_base_plus.pt
  sam2_repo: external/sam2
  segnext_repo: external/SegNeXt

sam2:
  model_size: base_plus
  config: configs/sam2.1/sam2.1_hiera_b+.yaml
  score_threshold: 0.45
  min_area_ratio: 0.01
  max_area_ratio: 0.85
  compile_image_encoder: false

dino:
  backbone: dinov2_vitb14
  image_size: 224
  batch_size: 32
  workers: 4
  epochs: 20
  lr: 0.0003
  weight_decay: 0.0001
  freeze_backbone: true
  unfreeze_last_blocks: 0
  label_smoothing: 0.05
  amp: true
  disease_artifact: artifacts/dino_disease/dino_disease_classifier.pt
  leaf_filter_artifact: artifacts/dino_leaf_filter/dino_leaf_filter.pt

segnext:
  repo: external/SegNeXt
  config: configs/segnext_plantseg.py
  checkpoint: artifacts/segnext/best.pth
  num_classes: 2
  crop_size: 512
  batch_size: 4
  epochs: 80

severity:
  labels_csv: data/processed/severity_labels.csv
  model: xgb_regressor.json
  feature_dim: 7
  target_min: 0.0
  target_max: 100.0

ood:
  method: mahalanobis
  percentile_threshold: 99.0
  min_confidence: 0.55

optimization:
  onnx_opset: 18
  quantize_dino: true
  quantize_severity: false
  dynamic_axes: true
